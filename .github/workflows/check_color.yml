name: Color Contrast Check

on: [push, pull_request]
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
          - name: 🏠 Checkout repo
            uses: actions/checkout@v4
          - name: 🟩 Set up Node
            uses: actions/setup-node@v4
            with:
                node-version: 22
          - name: 🧪 Check palette contrast and generated ports
            run: npm run check
